ocr:
  engine: paddleocr
  paddle_fallback_to_easyocr: true
  ocr_version: PP-OCRv4
  languages:
    - en
  use_angle_cls: true
  use_deskew: true
  use_text_region_refine: true
  text_region_min_area_ratio: 0.01
  text_region_padding_ratio: 0.08
  crop_padding_ratio: 0.16
  crop_padding_ratio_y: 0.22
  crop_padding_pixels: 10
  upscale_factor: 2.2
  min_crop_width: 192
  min_crop_height: 64
  rotation_candidates: [-8, -4, 0, 4, 8]
  valid_lot_pool:
    - 001A
    - 001B
    - 001C
    - 001D
    - 001E
    - 002A
    - 002B
    - 002C
    - 002D
    - 002E
    - 003A
    - 003B
    - 003C
    - 003D
    - 003E
    - 004A
    - 004B
    - 004C
    - 004D
    - 004E
  allowlist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-"
  min_confidence: 0.5
